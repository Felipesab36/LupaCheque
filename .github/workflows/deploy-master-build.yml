name: Deploy master build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-master
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app (production)
        run: npm run build

      - name: Setup SSH key
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "Missing required secret: SSH_PRIVATE_KEY"
            exit 1
          fi

          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "Missing required secret: DEPLOY_HOST"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          touch ~/.ssh/known_hosts
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null


      - name: Rsync build to server
        run: |
          # Ajusta ./dist al directorio de salida de tu build
          rsync -avz --delete -e "ssh -p ${SSH_PORT:-22}" ./dist/app/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.TARGET_DIR }}
      
      - name: Reload nginx
        run: ssh -p ${SSH_PORT:-22} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "${{ secrets.RELOAD_CMD }}" 
        env:
          SSH_AUTH_SOCK: ${{ env.SSH_AUTH_SOCK }}