name: Deploy master build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-master
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app (production)
        run: npm run build

      - name: Setup SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "Missing required secret: SSH_PRIVATE_KEY"
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

          if [ ! -s "$HOME/.ssh/id_rsa" ]; then
            echo "SSH private key file was not created or is empty"
            exit 1
          fi

          if ! ssh-keygen -y -f "$HOME/.ssh/id_rsa" >/dev/null 2>&1; then
            echo "SSH_PRIVATE_KEY is invalid or malformed"
            exit 1
          fi

          touch "$HOME/.ssh/known_hosts"
          ssh-keyscan -p "${SSH_PORT:-22}" -H "${{ secrets.DEPLOY_HOST }}" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true

      - name: Rsync build to server
        run: |
          # Ajusta ./dist al directorio de salida de tu build
          rsync -avz --delete -e "ssh -p ${SSH_PORT:-22}" ./dist/app/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.TARGET_DIR }}
      
      - name: Reload nginx
        run: ssh -p ${SSH_PORT:-22} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "${{ secrets.RELOAD_CMD }}" 
        env:
          SSH_AUTH_SOCK: ${{ env.SSH_AUTH_SOCK }}