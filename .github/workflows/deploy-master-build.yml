name: Deploy master build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-master
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app (production)
        run: npm run build

      - name: Setup SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_rsa"
          ssh-keyscan -p "${SSH_PORT:-22}" -H "${{ secrets.DEPLOY_HOST }}" > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Rsync build to server
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          # Ajusta ./dist al directorio de salida de tu build
          rsync -avz --delete -e "ssh -p ${SSH_PORT:-22}" ./dist/app/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.TARGET_DIR }}

      - name: Upload runtime .env
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: |
          if [ -z "${APP_ENV_FILE:-}" ]; then
            echo "Missing required secret: APP_ENV_FILE"
            exit 1
          fi

          printf '%s\n' "$APP_ENV_FILE" | ssh -p ${SSH_PORT:-22} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "umask 077; cat > '${{ secrets.TARGET_DIR }}/server/.env'"
      
      - name: Reload nginx
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: ssh -p ${SSH_PORT:-22} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "${{ secrets.RELOAD_CMD }}" 
