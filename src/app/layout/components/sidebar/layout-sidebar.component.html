<aside class="h-full bg-white border-r border-zinc-200/80 transition-all duration-300 flex flex-col" [ngClass]="collapsed ? 'w-20' : 'w-64'">
  <div class="h-16 px-4 flex items-center justify-center border-b border-zinc-100 shrink-0">
    <img src="/assets/logo.png" alt="LupaCheque" class="h-9 w-9 object-contain" />
  </div>

  <nav class="flex-grow overflow-y-auto p-3 space-y-1">
    @for (tab of tabs; track tab.name) {
      <a
        [routerLink]="['/', tab.route]"
        routerLinkActive
        #rla="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: true }"
        [attr.aria-current]="rla.isActive ? 'page' : null"
        class="w-full rounded-xl px-3 py-2.5 flex items-center gap-3 text-left transition-all group"
        [ngClass]="rla.isActive ? 'bg-emerald-50 text-emerald-700 border border-emerald-100' : 'text-zinc-500 hover:bg-zinc-50 border border-transparent'"
      >
        <mat-icon
          class="text-lg leading-none"
          [ngClass]="rla.isActive ? 'text-emerald-600' : 'text-zinc-400 group-hover:text-zinc-600'"
        >
          {{ tab.icon }}
        </mat-icon>
        @if (!collapsed) {
          <span class="truncate animate-fade-in">{{ t(tab.name) }}</span>
        }
      </a>
    }
  </nav>

  <div class="p-3 border-t border-zinc-100 bg-white">
    <button
      (click)="toggleSidebar.emit()"
      class="w-full flex items-center justify-center p-2.5 rounded-xl text-zinc-400 hover:text-emerald-600 hover:bg-emerald-50/50 transition-all cursor-pointer group"
      [title]="collapsed ? t('menu_expand') : t('menu_collapse')"
    >
      <mat-icon class="text-xl transition-transform duration-300" [ngClass]="collapsed ? 'rotate-180' : ''">
        first_page
      </mat-icon>
      @if (!collapsed) {
        <span class="ml-2.5 text-xs font-semibold animate-fade-in">{{ t('menu_collapse') }}</span>
      }
    </button>
  </div>

  <div class="p-4 border-t border-zinc-100 bg-zinc-50/40 shrink-0">
    <div class="flex items-center gap-3" [ngClass]="collapsed ? 'justify-center' : ''">
      <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse shrink-0" [title]="t('logged_as')"></div>
      @if (!collapsed) {
        <span class="text-[10px] text-zinc-400 font-mono truncate select-none animate-fade-in">{{ userEmail }}</span>
      }
    </div>
  </div>
</aside>
