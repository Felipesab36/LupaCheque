@if (!isLoggedIn()) {
  <app-layout-auth
    [t]="translate"
    [loginError]="loginError()"
    (login)="login()"
    (bypassLogin)="bypassLoginForDemo()"
  ></app-layout-auth>
} @else {
  <div class="h-screen w-full flex overflow-hidden bg-zinc-100/70">
    <app-layout-sidebar
      [tabs]="tabs"
      [collapsed]="sidebarCollapsed()"
      [userEmail]="userEmail()"
      [t]="translate"
      (toggleSidebar)="toggleSidebar()"
    ></app-layout-sidebar>

    <div class="flex-grow flex flex-col h-screen overflow-hidden" id="main-content-panel">
      <app-layout-header
        [t]="translate"
        [currentRouteTabLabel]="currentRouteTabLabel()"
        [selectedLanguage]="selectedLanguage()"
        [userRole]="userRole"
        [userPhotoUrl]="userPhotoUrl()"
        [hasAlerts]="hasAlerts()"
        [notificationCount]="notificationCount()"
        [showAlertsDropdown]="showAlertsDropdown()"
        [allNotifications]="allNotifications()"
        (setLanguage)="setLanguage($event)"
        (toggleAlerts)="toggleAlerts()"
        (closeAlerts)="closeAlerts()"
        (notificationClick)="handleNotificationClick($event)"
        (logout)="logout()"
      ></app-layout-header>

      <main class="flex-grow overflow-y-auto bg-zinc-50/10" id="feature-route-content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>

  <app-bank-alert-modal
    [isOpen]="isBancosAlertModalOpen()"
    [t]="translate"
    [currentAlert]="currentAlert()"
    [alertDecision]="alertDecision"
    [alertCorrectionSearchQuery]="alertCorrectionSearchQuery"
    [filteredCorrectionBanks]="filteredCorrectionBanks()"
    (close)="closeAlertModal()"
    (selectApproveNewBankWord)="selectApproveNewBankWord()"
    (selectCorrectionBank)="selectCorrectionDropdownBank($event)"
    (saveAndNext)="saveAndNextAlert()"
    (saveAndExit)="saveAndExitAlert()"
  ></app-bank-alert-modal>

  <app-payment-audit-modal
    [isOpen]="isPaymentModalOpen()"
    [selectedPayment]="selectedPaymentForAudit()"
    [isReceiptZoomed]="isReceiptZoomed"
    [rejectReasonText]="rejectReasonText"
    [t]="translate"
    (close)="closePaymentAuditModal()"
    (toggleReceiptZoom)="toggleReceiptZoom()"
    (approvePayment)="approvePayment($event)"
    (rejectPayment)="rejectPayment($event.id, $event.reason)"
  ></app-payment-audit-modal>
}
